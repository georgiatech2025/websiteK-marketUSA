# Render Blueprint: one Node service with persistent SQLite storage.
# This configuration uses paid resources. Review pricing before creating it.
services:
  - type: web
    name: k-market-usa
    runtime: node
    plan: starter
    region: virginia
    branch: main
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIRECTORY
        value: /var/data
    disk:
      name: customer-inquiries
      mountPath: /var/data
      sizeGB: 1
